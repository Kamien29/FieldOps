name: FieldOps UI checks
on:
  push:
    branches: [feature/system-light-dark-theme-20261105]
  pull_request:
    paths: ['fieldops-web/**', 'mobile/**']
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldops-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fieldops-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:offline
